max_width = 120
use_small_heuristics = "Max"
newline_style = "Unix"
use_field_init_shorthand = true

# nightly-only; applied by `cargo +nightly fmt`, ignored by stable
group_imports = "StdExternalCrate"
imports_granularity = "Crate"
fn_single_line = true
format_code_in_doc_comments = true
wrap_comments = true
comment_width = 120
