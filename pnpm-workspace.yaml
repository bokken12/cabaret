packages:
  - node
  - vscode
  - website

# esbuild's postinstall swaps its JS bin for a native binary, which pnpm's node shim then can't run.
allowBuilds:
  "@vscode/vsce-sign": false
  esbuild: false
  keytar: false

catalog:
  "oxfmt": 0.66.0
  "oxlint": 1.81.0
  "@napi-rs/cli": 3.8.6
  "@types/node": 22.20.1
  typescript: 7.0.2
  esbuild: 0.28.2
  "@vscode/vsce": 3.9.2
  "@vscode/test-cli": 0.0.15
  "@vscode/test-electron": 3.1.0
  "@types/mocha": 10.0.10
