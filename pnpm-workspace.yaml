packages:
  - node
  - vscode

# esbuild's postinstall swaps its JS bin for a native binary, which pnpm's node shim then can't run.
allowBuilds:
  "@vscode/vsce-sign": false
  esbuild: false
  keytar: false

catalog:
  "oxfmt": 0.80.0
  "oxlint": 1.95.0
  "@napi-rs/cli": 3.11.1
  "@types/node": 22.20.7
  typescript: 7.0.2
  esbuild: 0.28.2
  "@vscode/vsce": 4.1.1
  "@vscode/test-cli": 0.0.15
  "@vscode/test-electron": 3.1.0
  "@types/mocha": 10.0.10
