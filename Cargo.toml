[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
single_match = "allow"
single_match_else = "allow"
match_bool = "allow"
redundant_closure_for_method_calls = "allow"
# expect-test writes multiline snapshots as r#"…"#
needless_raw_string_hashes = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# transitive duplicates in gix/clap, not actionable here
multiple_crate_versions = "allow"
new_without_default = "allow"

[workspace.dependencies]
cabaret-config = { path = "crates/config" }
cabaret-lib = { path = "crates/lib" }
cabaret-page = { path = "crates/page" }
cabaret-transaction = { path = "crates/transaction" }
cabaret-types = { path = "crates/types" }

clap = { version = "4.6.6", features = ["derive"] }
elsa = "1.11.2"
expect-test = "1.5.1"
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
humantime = "2.4.0"
libc = "0.2.189"
jiff = "0.2.37"
gix = { version = "0.86.0", features = ["blocking-network-client", "blocking-http-transport-curl", "merge"] }
napi = { version = "3.12.1", default-features = false, features = ["napi8", "tokio_rt"] }
napi-build = "2.4.1"
napi-derive = "3.6.3"
nonempty-collections = "1.4.0"
ref-cast = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.23.0"
